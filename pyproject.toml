[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subconscious-mcp"
version = "0.2.0"
description = "Local-first semantic memory for MCP agents. Recall, remember, forget, echo, drift detection, stats over stdio."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vishal Jayaprakash" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "memory", "rag", "embeddings", "chromadb", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
subconscious-mcp = "subconscious_mcp.server:main"

[project.urls]
Homepage = "https://github.com/vishaltorc/subconscious-mcp"
Issues = "https://github.com/vishaltorc/subconscious-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
